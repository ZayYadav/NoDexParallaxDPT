name: Build ParallaxDPT

on:
  push:
    branches:
      - main
      - 'ci/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parallax-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.31.1" \
            "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build release shell and CLI
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean :shell:assembleRelease :parallax:jar

      - name: Verify build outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s executable/parallax.jar
          DEX=executable/shell-files/dex/classes.dex
          test -s "$DEX"

          DEX_SIZE=$(stat -c '%s' "$DEX")
          echo "Tiny bootstrap DEX: ${DEX_SIZE} bytes"
          echo "### Tiny bootstrap DEX" >> "$GITHUB_STEP_SUMMARY"
          echo "- classes.dex: ${DEX_SIZE} bytes" >> "$GITHUB_STEP_SUMMARY"

          # Guard against accidentally pulling optional Java security/UI code back into the stub.
          if [ "$DEX_SIZE" -gt 98304 ]; then
            echo "Bootstrap DEX is larger than 96 KiB (${DEX_SIZE} bytes)" >&2
            exit 1
          fi

          for abi in arm arm64 x86 x86_64; do
            test -s "executable/shell-files/libs/${abi}/ParallaxLover.so"
          done

          echo "Build outputs verified:"
          find executable -maxdepth 4 -type f -print | sort

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NoDexParallaxDPT-${{ github.sha }}
          path: |
            executable/parallax.jar
            executable/shell-files/**
          if-no-files-found: error
          retention-days: 14
