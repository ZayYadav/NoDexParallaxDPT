name: Build Shell and Protect P.apk

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'hard/**'
      - 'fix/**'
    paths:
      - 'shell/**'
      - 'parallax/**'
      - 'P.apk'
      - '.github/workflows/protect-p-apk.yml'
  pull_request:
    paths:
      - 'shell/**'
      - 'parallax/**'
      - 'P.apk'
      - '.github/workflows/protect-p-apk.yml'

permissions:
  contents: read

concurrency:
  group: parallax-protect-p-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-protect:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore pinned native dependencies
        shell: bash
        run: |
          set -euo pipefail

          fetch_dep() {
            local url="$1"
            local path="$2"
            local sha="$3"
            rm -rf "$path"
            git init -q "$path"
            git -C "$path" remote add origin "$url"
            git -C "$path" fetch -q --depth 1 origin "$sha"
            git -C "$path" checkout -q --detach FETCH_HEAD
            git -C "$path" submodule update --init --recursive --depth 1
            echo "$(basename "$path"): $(git -C "$path" rev-parse HEAD)"
          }

          fetch_dep https://github.com/zlib-ng/minizip-ng.git shell/src/main/cpp/external/minizip-ng fe5fedc365f7824ada0cf9a84fb79b30d5fc97a8
          fetch_dep https://github.com/bytedance/bhook.git shell/src/main/cpp/external/bhook c0a83d41e0820506068031149f5f0057cde0abfe
          fetch_dep https://github.com/luoyesiqiu/Dobby.git shell/src/main/cpp/external/Dobby f2f8a6a825d2c43aea598012b0dc8685eb6f651a
          fetch_dep https://github.com/Mbed-TLS/mbedtls.git shell/src/main/cpp/external/mbedtls e185d7fd85499c8ce5ca2a54f5cf8fe7dbe3f8df

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.31.1" \
            "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Build fresh release shell and CLI
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean
          ./gradlew --no-daemon :shell:assembleRelease :parallax:jar :parallax:test

          test -s executable/parallax.jar
          test -s executable/shell-files/dex/classes.dex
          test -s executable/shell-files/libs/arm/ParallaxLover.so
          test -s executable/shell-files/libs/arm64/ParallaxLover.so

      - name: Verify release stub class mapping
        shell: bash
        run: |
          set -euo pipefail
          DEX=executable/shell-files/dex/classes.dex
          STRINGS="$RUNNER_TEMP/shell-dex-strings.txt"
          strings "$DEX" > "$STRINGS"

          for i in $(seq 1 14); do
            name="Parallax${i}"
            grep -Fq "$name" "$STRINGS" || {
              echo "Expected mapped stub class is missing: $name" >&2
              exit 1
            }
          done
          for name in JangamBhai DarkDevel Keshav CrackWarTeamMC; do
            grep -Fq "$name" "$STRINGS" || {
              echo "Expected named stub class is missing: $name" >&2
              exit 1
            }
          done
          grep -Fq 'LParallax/Enc/CrackWarTeamMC;' "$STRINGS" || {
            echo "High-value VM bridge is missing: Parallax.Enc.CrackWarTeamMC" >&2
            exit 1
          }

          for banned in 'Lparallax/vm/' 'Lcom/parallax/shell/' 'Lcom/parallax/protection/'; do
            if grep -Fq "$banned" "$STRINGS"; then
              echo "Legacy release namespace leaked into shell DEX: $banned" >&2
              exit 1
            fi
          done

      - name: Verify native bootstrap layout
        shell: bash
        run: |
          set -euo pipefail
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          for SO in \
            executable/shell-files/libs/arm/ParallaxLover.so \
            executable/shell-files/libs/arm64/ParallaxLover.so; do
            "$READELF" -S "$SO" | grep -Fq '.bitcode' || {
              echo "Encrypted runtime section is missing from $SO" >&2
              exit 1
            }
            "$READELF" -d "$SO" | grep -Fq 'INIT_ARRAY' || {
              echo "Native bootstrap constructor is missing from $SO" >&2
              exit 1
            }
            if "$READELF" -l "$SO" | grep -Eq 'LOAD.*RWE'; then
              echo "Writable-executable load segment found in $SO" >&2
              exit 1
            fi
            python3 - "$READELF" "$SO" <<'PY'
          import re
          import subprocess
          import sys

          readelf, so_path = sys.argv[1:]
          output = subprocess.check_output([readelf, "--sections", "--wide", so_path], text=True)
          sections = {}
          pattern = re.compile(
              r"^\s*\[\s*\d+\]\s+(\S+)\s+\S+\s+([0-9a-fA-F]+)\s+"
              r"[0-9a-fA-F]+\s+([0-9a-fA-F]+)\s")
          for line in output.splitlines():
              match = pattern.match(line)
              if match:
                  sections[match.group(1)] = (int(match.group(2), 16), int(match.group(3), 16))

          bitcode_address, bitcode_size = sections[".bitcode"]
          plt_address, _ = sections[".plt"]
          page_size = 0x4000
          bitcode_end = bitcode_address + bitcode_size
          if bitcode_address % page_size or bitcode_end % page_size:
              raise SystemExit(
                  f".bitcode is not isolated on 16 KiB pages in {so_path}: "
                  f"address=0x{bitcode_address:x}, end=0x{bitcode_end:x}")
          if plt_address < bitcode_end:
              raise SystemExit(
                  f".plt overlaps the writable decryption range in {so_path}: "
                  f"plt=0x{plt_address:x}, bitcode_end=0x{bitcode_end:x}")
          print(f"Verified isolated .bitcode pages in {so_path}: 0x{bitcode_address:x}-0x{bitcode_end:x}")
          PY
          done

      - name: Extract P.apk from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          git cat-file -e refs/remotes/origin/main:P.apk
          git show refs/remotes/origin/main:P.apk > "$RUNNER_TEMP/P.apk"
          test -s "$RUNNER_TEMP/P.apk"

          echo "Source P.apk: $(stat -c '%s' "$RUNNER_TEMP/P.apk") bytes"
          sha256sum "$RUNNER_TEMP/P.apk"

      - name: Protect P.apk with runtime-safe automatic VM
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="$RUNNER_TEMP/parallax-protected"
          FINAL_DIR="$GITHUB_WORKSPACE/protected-artifact"
          PROTECT_LOG="$RUNNER_TEMP/parallax-protect.log"
          mkdir -p "$OUT_DIR" "$FINAL_DIR"

          pushd executable >/dev/null
          java -jar parallax.jar \
            -f "$RUNNER_TEMP/P.apk" \
            -o "$OUT_DIR" \
            --high-value-auto 2>&1 | tee "$PROTECT_LOG"
          popd >/dev/null

          grep -Fq 'High-value AUTO VM runtime-safe scope:' "$PROTECT_LOG" || {
            echo "Automatic VM did not report its runtime-safe application scope" >&2
            exit 1
          }

          for forbidden in \
            'Lcom/mundo/' \
            'Landroid/' \
            'Landroidx/' \
            'Ljava/' \
            'Ljavax/' \
            'Lkotlin/' \
            'Lkotlinx/' \
            'Lcom/google/' \
            'LParallax/' \
            'Lcom/parallax/'; do
            if grep -Fq "High-value VM: moved ${forbidden}" "$PROTECT_LOG"; then
              echo "Runtime/framework method was automatically virtualized: $forbidden" >&2
              grep -F "High-value VM: moved ${forbidden}" "$PROTECT_LOG" >&2 || true
              exit 1
            fi
          done

          mapfile -t APKS < <(find "$OUT_DIR" -type f -name '*.apk' -size +0c | sort)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "Parallax finished but no protected APK was produced in $OUT_DIR" >&2
            find "$OUT_DIR" -maxdepth 3 -type f -print || true
            exit 1
          fi

          if [ "${#APKS[@]}" -gt 1 ]; then
            echo "Multiple APK outputs found; choosing the largest protected APK:"
            printf '%s\n' "${APKS[@]}"
            PROTECTED_APK=$(find "$OUT_DIR" -type f -name '*.apk' -printf '%s %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)
          else
            PROTECTED_APK="${APKS[0]}"
          fi

          test -s "$PROTECTED_APK"
          unzip -t "$PROTECTED_APK" >/dev/null
          python3 - "$PROTECTED_APK" <<'PY'
          import sys
          import zipfile

          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as archive:
              if "assets/Parallax.vm" not in archive.namelist():
                  print("No runtime-safe app-owned PVM4 candidate found; normal DPT only for this APK")
              else:
                  payload = archive.read("assets/Parallax.vm")
                  if len(payload) <= 20 or payload[:4] != b"PVM4":
                      raise SystemExit("automatic high-value payload exists but is not valid PVM4")
                  print(f"Verified runtime-safe automatic PVM4 payload: {len(payload)} bytes")
          PY
          cp "$PROTECTED_APK" "$FINAL_DIR/P-Parallax-Protected.apk"

          echo "Protected APK: $(stat -c '%s' "$FINAL_DIR/P-Parallax-Protected.apk") bytes"
          sha256sum "$FINAL_DIR/P-Parallax-Protected.apk" | tee "$FINAL_DIR/P-Parallax-Protected.sha256"
          echo "### Protected P.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: main/P.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "- Output: P-Parallax-Protected.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "- High-value VM: runtime-safe app-owned automatic selection" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime/framework auto-VM denylist: verified" >> "$GITHUB_STEP_SUMMARY"
          echo "- Size: $(stat -c '%s' "$FINAL_DIR/P-Parallax-Protected.apk") bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify protected startup bootstrap wiring
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/protected-artifact/P-Parallax-Protected.apk"
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          MANIFEST_DUMP="$RUNNER_TEMP/protected-manifest.txt"
          DEX_STRINGS="$RUNNER_TEMP/protected-dex-strings.txt"

          "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml > "$MANIFEST_DUMP"
          unzip -p "$APK" classes.dex | strings > "$DEX_STRINGS"

          EXPECTED_APP="Parallax.Enc.Parallax1"
          EXPECTED_FACTORY="Parallax.Enc.Parallax2"

          grep -Fq "$EXPECTED_APP" "$MANIFEST_DUMP" || {
            echo "Protected manifest does not point to the mapped bootstrap Application: $EXPECTED_APP" >&2
            cat "$MANIFEST_DUMP" >&2
            exit 1
          }
          grep -Fq "$EXPECTED_FACTORY" "$MANIFEST_DUMP" || {
            echo "Protected manifest does not point to the mapped component factory: $EXPECTED_FACTORY" >&2
            cat "$MANIFEST_DUMP" >&2
            exit 1
          }

          for i in $(seq 1 14); do
            name="Parallax${i}"
            grep -Fq "$name" "$DEX_STRINGS" || {
              echo "Mapped protection class is absent from protected classes.dex: $name" >&2
              exit 1
            }
          done
          for name in JangamBhai DarkDevel Keshav CrackWarTeamMC; do
            grep -Fq "$name" "$DEX_STRINGS" || {
              echo "Named protection class is absent from protected classes.dex: $name" >&2
              exit 1
            }
          done
          grep -Fq 'LParallax/Enc/CrackWarTeamMC;' "$DEX_STRINGS" || {
            echo "High-value VM bridge is absent from protected classes.dex" >&2
            exit 1
          }

          for banned in 'Lparallax/vm/' 'Lcom/parallax/shell/' 'Lcom/parallax/protection/'; do
            if grep -Fq "$banned" "$DEX_STRINGS"; then
              echo "Legacy protection namespace leaked into protected APK: $banned" >&2
              exit 1
            fi
          done

          echo "- Bootstrap Application: $EXPECTED_APP" >> "$GITHUB_STEP_SUMMARY"
          echo "- Component factory: $EXPECTED_FACTORY" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release namespace: Parallax.Enc only" >> "$GITHUB_STEP_SUMMARY"
          echo "- Named anchors: JangamBhai / DarkDevel / Keshav / CrackWarTeamMC verified" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload protected APK
        uses: actions/upload-artifact@v4
        with:
          name: P-Parallax-Protected-${{ github.sha }}
          path: |
            protected-artifact/P-Parallax-Protected.apk
            protected-artifact/P-Parallax-Protected.sha256
          if-no-files-found: error
          retention-days: 14
