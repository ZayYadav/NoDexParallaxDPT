name: Build Shell and Protect P.apk

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'hard/**'
    paths:
      - 'shell/**'
      - 'parallax/**'
      - 'P.apk'
      - '.github/workflows/protect-p-apk.yml'

permissions:
  contents: read

concurrency:
  group: parallax-protect-p-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-protect:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore pinned native dependencies
        shell: bash
        run: |
          set -euo pipefail

          fetch_dep() {
            local url="$1"
            local path="$2"
            local sha="$3"
            rm -rf "$path"
            git init -q "$path"
            git -C "$path" remote add origin "$url"
            git -C "$path" fetch -q --depth 1 origin "$sha"
            git -C "$path" checkout -q --detach FETCH_HEAD
            git -C "$path" submodule update --init --recursive --depth 1
            echo "$(basename "$path"): $(git -C "$path" rev-parse HEAD)"
          }

          fetch_dep https://github.com/zlib-ng/minizip-ng.git shell/src/main/cpp/external/minizip-ng fe5fedc365f7824ada0cf9a84fb79b30d5fc97a8
          fetch_dep https://github.com/bytedance/bhook.git shell/src/main/cpp/external/bhook c0a83d41e0820506068031149f5f0057cde0abfe
          fetch_dep https://github.com/luoyesiqiu/Dobby.git shell/src/main/cpp/external/Dobby f2f8a6a825d2c43aea598012b0dc8685eb6f651a
          fetch_dep https://github.com/Mbed-TLS/mbedtls.git shell/src/main/cpp/external/mbedtls e185d7fd85499c8ce5ca2a54f5cf8fe7dbe3f8df

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.31.1" \
            "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Build fresh release shell and CLI
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean
          ./gradlew --no-daemon :shell:assembleRelease :parallax:jar

          test -s executable/parallax.jar
          test -s executable/shell-files/dex/classes.dex
          test -s executable/shell-files/libs/arm/ParallaxLover.so
          test -s executable/shell-files/libs/arm64/ParallaxLover.so

      - name: Extract P.apk from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          git cat-file -e refs/remotes/origin/main:P.apk
          git show refs/remotes/origin/main:P.apk > "$RUNNER_TEMP/P.apk"
          test -s "$RUNNER_TEMP/P.apk"

          echo "Source P.apk: $(stat -c '%s' "$RUNNER_TEMP/P.apk") bytes"
          sha256sum "$RUNNER_TEMP/P.apk"

      - name: Protect P.apk with fresh shell
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="$RUNNER_TEMP/parallax-protected"
          FINAL_DIR="$GITHUB_WORKSPACE/protected-artifact"
          mkdir -p "$OUT_DIR" "$FINAL_DIR"

          pushd executable >/dev/null
          java -jar parallax.jar \
            -f "$RUNNER_TEMP/P.apk" \
            -o "$OUT_DIR"
          popd >/dev/null

          mapfile -t APKS < <(find "$OUT_DIR" -type f -name '*.apk' -size +0c | sort)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "Parallax finished but no protected APK was produced in $OUT_DIR" >&2
            find "$OUT_DIR" -maxdepth 3 -type f -print || true
            exit 1
          fi

          if [ "${#APKS[@]}" -gt 1 ]; then
            echo "Multiple APK outputs found; choosing the largest protected APK:"
            printf '%s\n' "${APKS[@]}"
            PROTECTED_APK=$(find "$OUT_DIR" -type f -name '*.apk' -printf '%s %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)
          else
            PROTECTED_APK="${APKS[0]}"
          fi

          test -s "$PROTECTED_APK"
          unzip -t "$PROTECTED_APK" >/dev/null
          cp "$PROTECTED_APK" "$FINAL_DIR/P-Parallax-Protected.apk"

          echo "Protected APK: $(stat -c '%s' "$FINAL_DIR/P-Parallax-Protected.apk") bytes"
          sha256sum "$FINAL_DIR/P-Parallax-Protected.apk" | tee "$FINAL_DIR/P-Parallax-Protected.sha256"
          echo "### Protected P.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: main/P.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "- Output: P-Parallax-Protected.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "- Size: $(stat -c '%s' "$FINAL_DIR/P-Parallax-Protected.apk") bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload protected APK
        uses: actions/upload-artifact@v4
        with:
          name: P-Parallax-Protected-${{ github.sha }}
          path: |
            protected-artifact/P-Parallax-Protected.apk
            protected-artifact/P-Parallax-Protected.sha256
          if-no-files-found: error
          retention-days: 14
