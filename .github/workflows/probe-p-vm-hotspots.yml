name: Probe P.apk VM Hotspots

on:
  push:
    branches:
      - 'feature/max-vm-coverage-v5'
    paths:
      - '.github/workflows/probe-p-vm-hotspots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dexdump
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"

      - name: Probe BoxApplication Login Main methods
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pdex"
          unzip -q P.apk 'classes*.dex' -d "$RUNNER_TEMP/pdex"
          DEXDUMP="$ANDROID_HOME/build-tools/36.0.0/dexdump"
          python3 - "$DEXDUMP" "$RUNNER_TEMP/pdex" <<'PY'
          import os, re, subprocess, sys

          dexdump, root = sys.argv[1:]
          targets = re.compile(r'(BoxApplication|LoginActivity|LogAct|MainActivity|MAct)', re.I)
          total = 0
          for name in sorted(os.listdir(root)):
              if not re.fullmatch(r'classes\d*\.dex', name):
                  continue
              path = os.path.join(root, name)
              text = subprocess.check_output([dexdump, '-d', path], text=True, errors='replace')
              current_class = None
              current_method = None
              current_type = None
              current_access = None
              for raw in text.splitlines():
                  line = raw.strip()
                  m = re.match(r"Class descriptor\s*:\s*'([^']+)'", line)
                  if m:
                      current_class = m.group(1)
                      current_method = current_type = current_access = None
                      continue
                  if not current_class or not targets.search(current_class):
                      continue
                  m = re.match(r"name\s*:\s*'([^']+)'", line)
                  if m:
                      current_method = m.group(1)
                      current_type = current_access = None
                      continue
                  m = re.match(r"type\s*:\s*'([^']+)'", line)
                  if m and current_method:
                      current_type = m.group(1)
                      continue
                  m = re.match(r"access\s*:\s*(0x[0-9a-fA-F]+).*", line)
                  if m and current_method and current_type:
                      current_access = int(m.group(1), 16)
                      flags = []
                      if current_access & 0x1: flags.append('public')
                      if current_access & 0x2: flags.append('private')
                      if current_access & 0x4: flags.append('protected')
                      if current_access & 0x8: flags.append('static')
                      if current_access & 0x10: flags.append('final')
                      if current_access & 0x100: flags.append('native')
                      print(f'HOTSPOT {current_class}->{current_method}{current_type} access=0x{current_access:x} flags={"|".join(flags) or "package"}')
                      total += 1
                      current_method = current_type = current_access = None
          print(f'HOTSPOT_TOTAL={total}')
          if total == 0:
              raise SystemExit('No BoxApplication/Login/Main hotspot methods found in P.apk')
          PY
